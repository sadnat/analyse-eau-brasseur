# Durée de cache selon le type de contenu : le HTML est toujours revalidé,
# JS/CSS portent une empreinte de contenu (?v=<md5>) et peuvent être cachés longtemps.
# `expires` ne compte pas comme add_header : les en-têtes de sécurité restent hérités.
map $sent_http_content_type $static_expires {
    default                 off;
    ~text/html              epoch;
    ~text/css               1y;
    ~application/javascript 1y;
    ~image/svg              7d;
}

server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;
    expires $static_expires;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # --- En-tetes de securite ---
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://geo.api.gouv.fr https://hubeau.eaufrance.fr; img-src 'self' data:;" always;

    # Protection contre le clickjacking
    add_header X-Frame-Options "DENY" always;

    # Protection contre le MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Politique de referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restreindre l'acces aux APIs du navigateur
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # --- Bloquer l'acces aux fichiers caches (.git, .env, etc.) ---
    location ~ /\. {
        deny all;
        return 404;
    }

    # --- Proxy vers le backend SISE-Eaux ---
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Pas d'add_header ici : nginx n'hériterait plus des en-têtes de sécurité du bloc server
    location / {
        try_files $uri $uri/ /index.html;
    }
}
